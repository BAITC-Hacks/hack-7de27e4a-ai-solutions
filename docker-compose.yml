services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Все переменные опциональны: без ключа приложение работает полностью.
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-2500}
      LLM_AGENT_TIMEOUT_MS: ${LLM_AGENT_TIMEOUT_MS:-10000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - career_quest_runtime:/app/data/runtime

volumes:
  career_quest_runtime:
